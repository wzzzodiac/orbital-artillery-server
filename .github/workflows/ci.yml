name: Server CI

on:
  push:
    branches: [main, phase10-development]
  pull_request:
    branches: [main, phase10-development]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - run: npm run check
